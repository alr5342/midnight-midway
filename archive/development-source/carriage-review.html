<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferris wheel carriage — before and after</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="artwork.css">
  <style>
    main { max-width: 900px; }
    .comparisons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; }
    figcaption { text-align: center; margin: 14px 0; color: #c8c2cc; }
    @media (max-width: 600px) { .comparisons { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">Focused artwork refinement</p><h1>The right-hand carriage</h1><p>Matching open structure, with a restrained mysterious glow.</p></header>
    <div class="comparisons">
      <figure><figcaption>Before</figcaption><div class="phone" data-ui="on"><div class="scene" data-view="assembled" data-attractions data-carriage="before"><img class="plate layer" src="assets/midway-clean-plate.png" alt=""><img class="booth layer" src="assets/ticket-booth.png" alt=""><img class="foreground layer" src="reference/midnight-midway-concept.png" alt=""><div class="scene-ui" aria-hidden="true"><span class="pause-mockup">Ⅱ</span><p class="hint-mockup">Some guests never left the midway…</p></div></div></div></figure>
      <figure><figcaption>After</figcaption><div class="phone" data-ui="on"><div class="scene" data-view="assembled" data-attractions><img class="plate layer" src="assets/midway-clean-plate.png" alt=""><img class="booth layer" src="assets/ticket-booth.png" alt=""><img class="foreground layer" src="reference/midnight-midway-concept.png" alt=""><div class="scene-ui" aria-hidden="true"><span class="pause-mockup">Ⅱ</span><p class="hint-mockup">Some guests never left the midway…</p></div></div></div></figure>
    </div>
    <p class="caption"><a href="index.html">Return to full phone preview</a></p>
  </main>
  <script src="artwork.js"></script>
</body>
</html>
