  <template id="preview-prize">
    <header><p class="eyebrow">Visual approval checkpoint</p><h1>The three-can knockdown</h1><p>A small game counter within the existing prize stall. Static staging only.</p></header>
    <section class="review-controls" aria-label="Prize staging review controls">
      <label>Phone proportions <select id="prize-ratio"><option value="tall">Tall phone · 390 × 844</option><option value="reference">Full composition</option><option value="short">Short phone · 375 × 667</option></select></label>
      <label class="ending-return-control"><input id="prize-zones" type="checkbox">Show proposed aim zones (review only)</label>
    </section>
    <div class="phone" id="prize-phone" data-ui="on" data-ratio="tall">
      <div class="scene prize-scene" id="prize-scene" data-view="assembled" data-attractions role="img" aria-label="Static midway with a three-can pyramid, two beanbags and a weathered rules sign on a small counter beneath the prize stall. No game interaction.">
        <img class="plate layer" src="../../assets/artwork/midway-clean-plate.png" alt="">
        <img class="booth layer" src="../../assets/artwork/ticket-booth.png" alt="">
        <img class="foreground layer" src="../../assets/sources/artwork/midnight-midway-concept.png" alt="">
        <div class="prize-props" aria-hidden="true">
          <img class="prize-counter" src="assets/prize-counter-v1.png" alt="">
          <img class="prize-can prize-can-left" src="assets/prize-can-v1.png" alt="">
          <img class="prize-can prize-can-right" src="assets/prize-can-v1.png" alt="">
          <img class="prize-can prize-can-top" src="assets/prize-can-v1.png" alt="">
          <svg class="prize-counter prize-bags-front" viewBox="0 0 2048 768"><defs><clipPath id="waiting-bags"><path d="M130 235L327 141L395 181L430 175Q557 175 650 285L641 310L470 334L334 349L161 324Z"/></clipPath></defs><image href="assets/prize-counter-v1.png" width="2048" height="768" clip-path="url(#waiting-bags)"/></svg>
          <svg class="prize-rules" viewBox="0 0 160 90">
            <svg width="160" height="90" viewBox="1450 390 520 230" preserveAspectRatio="none"><image href="assets/prize-counter-v1.png" width="2048" height="768"/></svg>
            <g fill="currentColor" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" opacity=".85"><text x="80" y="41" font-size="24">2 BAGS</text><text x="80" y="68" font-size="24">3 CANS</text></g>
          </svg>
          <span class="prize-aim prize-aim-left"></span><span class="prize-aim prize-aim-right"></span><span class="prize-aim prize-aim-top"></span>
        </div>
        <div class="scene-ui" aria-hidden="true"><span class="pause-mockup">Ⅱ</span><p class="hint-mockup">The last prize has been waiting a very long time.</p></div>
      </div>
    </div>
    <p class="caption">Review the stack, contact shadows, two waiting bags and the worn sign at phone size. Dents/scuffs suggest where past throws landed; the sign gives the objective without revealing where to aim. Optional circles show proposed generous aim areas, not working controls. No throws, falling cans, scoring, audio, token claim or ending playback is implemented here.</p>
    <p class="caption"><a href="../../index.html">Return to the unchanged working prototype</a> · <a href="?view=ending">Approved ending staging</a></p>
  </template>
  <template id="preview-artwork">
    <header><p class="eyebrow">Visual checkpoint 02</p><h1>The Midnight Midway</h1><p>Complete static artwork &amp; interface placement</p></header>
    <section class="review-controls" aria-label="Artwork review controls">
      <label>View <select id="view"><option value="original">Original reference</option><option value="assembled" selected>Full static assembly</option><option value="attraction-pieces">Horses &amp; prizes — isolated</option><option value="attraction-displaced">Horses &amp; prizes — lifted</option><option value="before">First booth assembly</option><option value="plate">Booth repair plate</option><option value="cutout">Booth on checkerboard</option><option value="displaced">Displaced booth</option></select></label>
      <label>Phone proportions <select id="ratio"><option value="reference">Reference · full composition</option><option value="tall">Tall phone · 390 × 844</option><option value="short">Short phone · 375 × 667</option></select></label>
      <label>Interface mockup <select id="ui"><option value="on">Show Play/Pause &amp; hint</option><option value="off">Artwork only</option></select></label>
    </section>
    <div class="phone" id="phone" data-ui="on">
      <div class="scene" id="scene" data-view="assembled" data-attractions role="img" aria-label="Moonlit Halloween midway with a Ferris wheel, ticket booth, carousel and prize stall. Static Pause control and story hint placement shown.">
        <img class="original layer" src="../../assets/sources/artwork/midnight-midway-concept.png" alt="" fetchpriority="high">
        <img class="plate layer" src="../../assets/artwork/midway-clean-plate.png" alt="">
        <img class="booth layer" src="../../assets/artwork/ticket-booth.png" alt="">
        <img class="foreground layer" src="../../assets/sources/artwork/midnight-midway-concept.png" alt="">
        <div class="scene-ui" aria-hidden="true"><span class="pause-mockup">Ⅱ</span><p class="hint-mockup">Some guests never left the midway…</p></div>
      </div>
    </div>
    <p class="caption" id="caption" aria-live="polite">Full static assembly with original horse and prize pixels. Play/Pause and hint are nonfunctional placement mockups.</p>
    <p class="caption"><a href="?view=carriage">Carriage before / after</a> · <a href="?view=scene">Full scene comparison</a> · <a href="?view=booth">Approved booth comparison</a></p>
    <details><summary>What to inspect</summary><p>Compare the assembled artwork against the original, then inspect the isolated horses and prize pair. The lifted view uses small static offsets to reveal the repaired surfaces. There is no animation.</p><p>Play/Pause sits over the upper-left sky, away from the moon and attractions. A short hint sits over the bottom path. Both are static visual mockups. Hide them to review the artwork alone. Tall phones preserve the complete image with dark space above and below.</p></details>

  </template>

  <template id="preview-booth">

  <template id="preview-scene">
    <header><p class="eyebrow">Visual checkpoint 02</p><h1>The full midway</h1><p>Original-pixel pieces, retained foreground, static interface mockups.</p></header>
    <div class="comparisons">
      <figure><figcaption>Full scene + interface placement</figcaption><div class="phone" data-ui="on"><div class="scene" data-view="assembled" data-attractions><img class="plate layer" src="../../assets/artwork/midway-clean-plate.png" alt=""><img class="booth layer" src="../../assets/artwork/ticket-booth.png" alt=""><img class="foreground layer" src="../../assets/sources/artwork/midnight-midway-concept.png" alt=""><div class="scene-ui" aria-hidden="true"><span class="pause-mockup">Ⅱ</span><p class="hint-mockup">Some guests never left the midway…</p></div></div></div></figure>
      <figure><figcaption>Artwork only</figcaption><div class="phone"><div class="scene" data-view="assembled" data-attractions><img class="plate layer" src="../../assets/artwork/midway-clean-plate.png" alt=""><img class="booth layer" src="../../assets/artwork/ticket-booth.png" alt=""><img class="foreground layer" src="../../assets/sources/artwork/midnight-midway-concept.png" alt=""></div></div></figure>
      <figure><figcaption>Lifted pieces — repair inspection</figcaption><div class="phone"><div class="scene" data-view="attraction-displaced" data-attractions><img class="plate layer" src="../../assets/artwork/midway-clean-plate.png" alt=""><img class="booth layer" src="../../assets/artwork/ticket-booth.png" alt=""><img class="foreground layer" src="../../assets/sources/artwork/midnight-midway-concept.png" alt=""></div></div></figure>
    </div>
    <p class="caption">The third view uses fixed offsets, not animation. The ghost and cat remain a pair because they overlap in the reference. Alternate poses and individual prize separation are outside this checkpoint.</p>
    <p class="caption"><a href="../../index.html">Phone-size preview and inspection controls</a></p>

  </template>
  <template id="preview-story">
    <header><p class="eyebrow">P1.6 · Story assets and storyboard</p><h1>A ticket after midnight</h1><p>Eight active seconds. Static staging only; no story playback or bell trigger.</p></header>
    <section class="review-controls" aria-label="Storyboard inspection">
      <label>Story beat<select id="beat"></select></label>
      <label>Artwork<select id="art"><option value="show">Show staged assets</option><option value="hide">Approved scene only</option></select></label>
    </section>
    <div class="phone"><div class="scene" id="story-scene" data-view="assembled" data-attractions role="img" aria-label="Static ticket-booth story staging in the approved midway scene">
      <img class="plate layer" src="../../assets/artwork/midway-clean-plate.png" alt="">
      <img class="booth layer" src="../../assets/artwork/ticket-booth.png" alt="">
      <img class="foreground layer" src="../../assets/sources/artwork/midnight-midway-concept.png" alt="">
    </div></div>
    <p class="caption">Change beats manually to inspect placement and reset. The bell is decorative here. Pausable motion, sound scheduling and story lockout will be implemented in P1.7; three-ring interaction and hints in P1.8.</p>
    <details><summary>Sound candidates — press Play to audition</summary><p>CC0 sources and edits: <a href="../../CREDITS.md">credits</a>. These independent audition controls belong only to this review page.</p><div id="sounds"></div></details>
    <p class="caption"><a href="../../index.html">Return to current Phase 1 prototype</a> · <a href="../../docs/artwork/story/STORYBOARD.md">Storyboard and integration contract</a></p>

  </template>
  <template id="preview-ending">
    <header><p class="eyebrow">Visual staging · awaiting approval</p><h1>A night remembered</h1><p>Static poses for the approved ten-second disappearance. Change stages manually; nothing plays.</p></header>
    <section class="review-controls" aria-label="Ending visual inspection">
      <label>Visual stage<select id="ending-beat">
        <option value="offered">Before claim · token offered</option>
        <option value="claimed">2 seconds · booth disappearing</option>
        <option value="fading">5 seconds · carousel and stall fading</option>
        <option value="wheel">8 seconds · wheel over empty land</option>
        <option value="gone">10 seconds · token and empty land</option>
      </select></label>
      <label>Phone proportions<select id="ending-ratio"><option value="reference">Reference · full composition</option><option value="tall" selected>Tall phone · 390 × 844</option><option value="short">Short phone · 375 × 667</option></select></label>
      <label class="ending-return-control"><input type="checkbox" id="ending-return"> Show eventual Revisit placement</label>
    </section>
    <div class="phone ending-phone" id="ending-phone" data-ratio="tall">
      <div class="ending-stage" id="ending-stage" data-beat="offered" role="img" aria-label="The approved midway, with a brass souvenir token offered above the prize counter.">
        <img class="ending-land" src="assets/empty-field-v1.png" alt="">
        <div class="scene ending-artwork" data-view="assembled" data-attractions aria-hidden="true">
          <img class="plate layer" src="../../assets/artwork/midway-clean-plate.png" alt="">
          <img class="booth layer" src="../../assets/artwork/ticket-booth.png" alt="">
          <img class="foreground layer" src="../../assets/sources/artwork/midnight-midway-concept.png" alt="">
        </div>
        <div class="ending-attraction-memory ending-booth-memory" data-attraction="booth" aria-hidden="true"></div>
        <div class="ending-attraction-memory ending-carousel-memory" data-attraction="carousel" aria-hidden="true"></div>
        <div class="ending-attraction-memory ending-stall-memory" data-attraction="stall" aria-hidden="true"></div>
        <div class="ending-attraction-memory ending-wheel-memory" data-attraction="wheel" aria-hidden="true"></div>
        <div class="ending-fog" aria-hidden="true"></div>
        <div class="ending-last-light" aria-hidden="true"></div>
        <img class="ending-token" src="assets/keepsake-token-v1.svg" alt="">
        <span class="pause-mockup ending-pause" aria-hidden="true">Ⅱ</span>
        <span class="ending-revisit" aria-hidden="true">Revisit the midway</span>
      </div>
    </div>
    <p class="caption" id="ending-caption" aria-live="polite">Before claim: the token waits above the prize counter. The park remains fully visible.</p>
    <p class="caption">The attractions disappear; the moonlit field stays visible. Pause and Revisit are nonfunctional placement mockups. The checkbox previews a later return option. No audio, timers, gameplay or progress persistence is implemented.</p>
    <figure class="token-study"><img src="assets/keepsake-token-v1.svg" alt="Antique brass Ferris-wheel token, inscribed A NIGHT REMEMBERED."><figcaption>Token detail · original editable SVG candidate<br>Brass, worn rim and embossed open-gondola wheel.</figcaption></figure>
    <details><summary>What to review</summary><p>Inspect the token at its offered and final sizes, the separate attraction fades at 2/5 seconds, and whether the wheel reads as the last structure over the empty field at 8 seconds. A preview-only generated repair plate supplies land behind the original attractions; approved artwork files are unchanged. Intermediate times are proposed poses, not implemented playback.</p><p>Approved journey: three bell rings → musical horse puzzle → two-throw target game → claim the brass token → ten-second disappearance. Revisit and refresh will begin completely fresh journeys when gameplay is implemented.</p></details>
  </template>
